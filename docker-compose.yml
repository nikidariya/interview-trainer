services:
  app:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
